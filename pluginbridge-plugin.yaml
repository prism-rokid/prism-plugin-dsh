id: dsh
schema_version: 1
display_name: DeepSeek Harness
description: 连接本机 DeepSeek Harness，会话可在 Prism Hub、移动端和桌面端之间继续使用。
icon_url: https://www.deepseek.com/harness/favicon.svg
icon_svg_url: https://www.deepseek.com/harness/favicon.svg
version: 0.1.4
plugin_protocol_version: "4"
min_hub_version: 0.1.0
integration_mode: desktop-automation
transport: process
runtime_modes: [desktop, native]
default_runtime_mode: desktop
runtime_controls:
  desktop:
    model: stable
    reasoning: stable
    permission: stable
  native:
    model: stable
    reasoning: stable
    permission: stable
runtime_operations:
  desktop:
    rename: direct
    archive: direct
    delete: unsupported
  native:
    rename: direct
    archive: direct
    delete: unsupported
runtime_dependencies:
  node: ">=22.0.0 <23.0.0"
managed_launch: true
managed_launch_specs:
  - kind: desktop-app
    app: dsh
    ready: probe
    runtime_modes: [desktop]
command: ["${runtime.node}", "index.js"]
capabilities:
  native_visible_input: true
  native_visible_output: true
  can_attach_session: true
  can_start_session_with_message: true
  can_open_draft: true
  can_list_sessions: true
  can_read_history: true
  can_interrupt: true
  can_approval: true
  can_forward_sync: true
  can_reverse_sync: true
  can_plugin_wide_watch: true
  can_wait_run: true
  can_read_status: true
  can_control_session: true
